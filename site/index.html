<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anton Perch | Portfolio moved</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://perchusha.github.io/portfolio/" />
    <meta http-equiv="refresh" content="0; url=https://perchusha.github.io/portfolio/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background-color: #09090b;
        color: #fafafa;
        font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      .eyebrow {
        margin: 0 0 1rem;
        font-family: 'Space Mono', ui-monospace, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #a1a1aa;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.5rem, 5vw, 2.25rem);
        font-weight: 600;
        line-height: 1.2;
      }
      p.lead {
        margin: 0 0 2rem;
        color: #a1a1aa;
        line-height: 1.6;
      }
      a.cta {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        background-color: #fafafa;
        color: #09090b;
        font-weight: 600;
        text-decoration: none;
      }
      a.cta:hover {
        background-color: #d4d4d8;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Moved</p>
      <h1>This portfolio has a new home</h1>
      <p class="lead">
        Redirecting you to perchusha.github.io/portfolio. If nothing happens, follow the link below.
      </p>
      <a class="cta" href="https://perchusha.github.io/portfolio/">Go to the portfolio</a>
    </main>
    <script>
      ;(function () {
        var base = 'https://perchusha.github.io/portfolio/'
        var rest = window.location.pathname.replace(/^\/Portfolio_v2\/?/i, '')
        window.location.replace(base + rest + window.location.search + window.location.hash)
      })()
    </script>
  </body>
</html>
